# nginx site for the CPMS test app. Installed to /etc/nginx/sites-available/cpms and enabled
# (see send_to_cpms/web/INSTALL.md). Replace cpms.example.com with the real domain.
# Starts as plain HTTP; `certbot --nginx` then adds HTTPS and the HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cpms.example.com;

    # Everyone must log in (basic auth); passwords in /etc/nginx/cpms.htpasswd.
    auth_basic           "CPMS";
    auth_basic_user_file /etc/nginx/cpms.htpasswd;

    # Let's Encrypt must reach its challenge files without a password.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass         http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # a registration waits up to ~90 s for CPMS's result
    }
}
